# Blinko demo for Arduino Nano 33 BLE (nRF52840)
CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_FLASH=y
CONFIG_REBOOT=y
CONFIG_NRFX_NVMC=y
CONFIG_COUNTER=y
CONFIG_FLASH_MAP=y
CONFIG_BLINKO=y
CONFIG_BLINKO_BURST_OFF_MS=0
CONFIG_BLINKO_RAM_RECORD_ADDR=0x2003F000

# USB CDC shell
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Blinko Nano33BLE"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x805A
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="blinko> "
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_BLINKO_LOG_BACKEND=y

# fault handling: our k_sys_fatal_error_handler takes over
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_MAIN_STACK_SIZE=2048
